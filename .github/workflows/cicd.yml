name: Vehicle Parking Fee Calculator CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  build-and-test:
    name: Build and Test Java Application
    runs-on: ubuntu-latest

    steps:

      # Step 1: Checkout GitHub repository
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Step 2: Setup Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Step 3: Build and execute JUnit tests
      - name: Maven Build and Test
        run: mvn -B clean verify

      # Step 4: Setup Docker Buildx
      - name: Setup Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      # Step 5: Login to Docker Hub
      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 6: Build and push Docker image
      - name: Build and Push Docker Image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/vehicle-parking-fee-calculator:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/vehicle-parking-fee-calculator:${{ github.sha }}
