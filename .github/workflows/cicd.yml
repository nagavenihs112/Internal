name: Vehicle Parking Fee Calculator - CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:

      # Step 1: Get source code from GitHub
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Setup Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Step 3: Build Maven project and run JUnit tests
      - name: Build and Run Tests
        run: mvn clean verify

      # Step 4: Display success message
      - name: Build Successful
        if: success()
        run: echo "Vehicle Parking Fee Calculator built and tested successfully!"
